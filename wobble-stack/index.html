<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#c8b8f1">
  <title>Wobble Stack · Rooftop Jelly Co.</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='18' width='52' height='30' rx='12' fill='%234bf3bb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" aria-label="Wobble Stack game">
    <canvas id="canvas" aria-label="A jelly block slides above the rooftop. Tap to drop it onto the tower."></canvas>
    <header class="hud">
      <div class="brand">WOBBLE STACK<span>ROOFTOP JELLY CO.</span></div>
      <button id="pause" class="icon-button" aria-label="Pause game" title="Pause (P)">Ⅱ</button>
      <div class="score-wrap"><output id="score" aria-label="Current score">0</output><span id="best">BEST 0</span></div>
    </header>
    <div id="message" class="message" aria-live="polite">Tap to drop.</div>
    <footer><span id="hint">or press Space</span><span class="factory">made to wobble<span class="spark" aria-hidden="true"></span></span></footer>
    <section id="overlay" class="overlay" hidden aria-label="Game status">
      <div class="card">
        <span id="eyebrow" class="eyebrow">SHIFT REPORT</span>
        <h1 id="title">Jelly down!</h1>
        <p id="description">One more for the rooftop?</p>
        <div id="result" class="result"></div>
        <button id="action" class="action">Stack again <span>↗</span></button>
        <p id="actionHint" class="action-hint">Tap anywhere or press Space</p>
      </div>
    </section>
  </main>
  <script type="module" src="game.mjs"></script>
</body>
</html>
