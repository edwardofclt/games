<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101f3b">
<title>Loop Hop · One more lap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game" aria-label="Loop Hop arcade game">
  <header><span class="wordmark">LOOP HOP<span class="dot">●</span></span><button id="pause" aria-label="Pause game" disabled>Ⅱ</button></header>
  <section class="scoreboard" aria-label="Score"><div id="score">0</div><div class="record">BEST <span id="best">0</span><span class="separator">/</span><span id="lap-label">ONE MORE LAP</span></div></section>
  <div class="arena"><canvas id="canvas" tabindex="0" aria-label="Pip runs clockwise around a ring. Tap or press Space to jump over the coral spike."></canvas></div>
  <footer><div id="message" role="status" aria-live="polite"><h1>Meet Pip. Chase a lap.</h1><p>One little spike. Endless second chances.</p></div><button id="action">Tap to jump <span>↗</span></button><p id="hint">TAP ANYWHERE · SPACE ON KEYBOARD</p></footer>
</main>
<script type="module" src="game.mjs"></script>
</body>
</html>
